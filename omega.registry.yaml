# yaml-language-server: $schema=https://raw.githubusercontent.com/Agrim-Intelligence/omega/pre-prod/docs/CONTRACTS/omega-registry.v1.schema.json
version: 1
vendor:
  name: Kill Bill test target
  release_profile:
    tests_live_in: product-repo
    product_branch_rule: master
lines:
- id: default
  status: active
  branch: master
deployments:
- id: qa
  kind: pre-production
  base_url: https://kaui-qa-production.up.railway.app
- id: uat
  kind: pre-production
  base_url: https://kaui-uat-production.up.railway.app
- id: staging
  kind: pre-production
  base_url: https://kaui-production-8bf2.up.railway.app
clients:
- id: default
  name: Default
  links:
  - id: default_qa
    deployment: qa
    records:
      needs:
        account:
          kind: journey
          journey: create-a-new-customer-account
          key: account_id
    features:
      tagging: true
      tags: true
      tenant-setup: true
      subscription-management: true
      '1': true
      invoices: true
      kpm: true
      users-sign-in: true
      custom-field-records: true
      plugin-pages: true
      admin-allowed-users: true
      admin-access: true
      admin-tenants: true
      queue-monitoring: true
      sign-in: true
      subscriptions: true
      payment-methods: true
      queues: true
      payments: true
      payment-method-management: true
      user-authentication: true
      custom-fields: true
      payment-collection: true
      accounts: true
      tag-definitions: true
      invoicing: true
      customer-accounts: true
      embedded-page: true
      plugin-management: true
    accounts:
    - admin
    sign_in:
      account: admin
      username: admin
      login:
        method: POST
        path: /users/sign_in
        body:
          username: '{username}'
          password: '{password}'
      landing:
        path: /
        json_key: status
    effects_allowed:
    - email
    - text
    - payment
    - partner
    outbound_safe:
      email: disabled
      payment: test-mode
      text: disabled
      partner: disabled
  - id: default_uat
    deployment: uat
    accounts:
    - admin
  - id: default_staging
    deployment: staging
    accounts:
    - admin
- id: client-a
  name: Client A
  links:
  - id: client-a_qa
    deployment: qa
    accounts:
    - admin
- id: client-b
  name: Client B
  links:
  - id: client-b_uat
    deployment: uat
    accounts:
    - admin
