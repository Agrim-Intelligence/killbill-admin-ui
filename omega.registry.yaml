# yaml-language-server: $schema=https://raw.githubusercontent.com/Agrim-Intelligence/omega/pre-prod/docs/CONTRACTS/omega-registry.v1.schema.json
version: 1
vendor:
  name: Kill Bill test target
  release_profile:
    tests_live_in: product-repo
    product_branch_rule: master
lines:
- id: default
  status: active
  branch: master
deployments:
- id: qa
  kind: pre-production
  base_url: https://kaui-qa-production.up.railway.app
- id: uat
  kind: pre-production
  base_url: https://kaui-uat-production.up.railway.app
- id: staging
  kind: pre-production
  base_url: https://kaui-production-8bf2.up.railway.app
clients:
- id: default
  name: Default
  links:
  - id: default_qa
    deployment: qa
  - id: default_uat
    deployment: uat
    accounts:
    - admin
  - id: default_staging
    deployment: staging
    accounts:
    - admin
- id: client-a
  name: Client A
  links:
  - id: client-a_qa
    deployment: qa
    accounts:
    - admin
- id: client-b
  name: Client B
  links:
  - id: client-b_uat
    deployment: uat
    accounts:
    - admin
