# yaml-language-server: $schema=https://raw.githubusercontent.com/Agrim-Intelligence/omega/pre-prod/docs/CONTRACTS/omega-registry.v1.schema.json
version: 1
vendor:
  name: Kill Bill test target
  release_profile:
    tests_live_in: product-repo
    product_branch_rule: master
lines:
- id: default
  status: retired
  branch: master
- id: v4.0
  status: maintenance
  branch: qa
  match: 4\.0\.\d+
- id: v4.1
  status: active
  branch: qa
  match: 4\.1\.\d+
deployments:
- id: qa
  kind: pre-production
  base_url: https://kaui-qa-production.up.railway.app
- id: uat
  kind: pre-production
  base_url: https://kaui-uat-production.up.railway.app
- id: staging
  kind: pre-production
  base_url: https://kaui-production-8bf2.up.railway.app
clients:
- id: default
  name: Default
  links:
  - id: default_qa
    deployment: qa
    records:
      needs:
        account:
          kind: journey
          journey: create-a-new-customer-account
          key: account_id
    features:
      '1': true
      accounts: true
      admin-access: true
      admin-allowed-users: true
      admin-tenants: true
      custom-field-records: true
      custom-fields: true
      customer-accounts: true
      embedded-page: true
      invoices: true
      invoicing: true
      kpm: true
      payment-collection: true
      payment-method-management: true
      payment-methods: true
      payments: true
      plugin-management: true
      plugin-pages: true
      queue-monitoring: true
      queues: true
      sign-in: true
      subscription-management: true
      subscriptions: true
      tag-definitions: true
      tagging: true
      tags: true
      tenant-setup: true
      user-authentication: true
      users-sign-in: true
    accounts:
    - admin
    effects_allowed:
    - email
    - text
    - payment
    - partner
    outbound_safe:
      email: disabled
      payment: test-mode
      text: disabled
      partner: disabled
